[package]
name = "runcirrus"
version = "0.1.0"
edition = "2024"

[lib]
name = "runkarsk"

[[bin]]
name = "runcirrus"

[[bin]]
name = "runphast"

[[bin]]
name = "runpflotran"

[dependencies]
async-trait = "0.1.91"
clap = { version = "4.6.2", features = ["derive"] }
regex = "1.13.1"
tokio = { version = "1.53.0", features = ["full"] }
which = "8.0.5"

[dev-dependencies]
testdir = "0.10.0"
