[project]
name = "runscript"
version = "0.1.0"
description = "Generic MPI job wrapper for HPC clusters"
readme = "README.md"
authors = [
    { name = "Lars Petter Hauge", email = "lpha@equinor.com" },
    { name = "Zohar Malamant", email = "ZOM@equinor.com"},
    {name = "CCS Data Digital", email = "fg_CCS_Data_Digital@equinor.com"}
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runscript-configure = "runscript.configure:main"
runscript = "runscript.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.15.1",
    "ruff>=0.11.5",
]
